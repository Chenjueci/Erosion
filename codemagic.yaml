workflows:
  erosion-unsigned:
    name: Erosion unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
    scripts:
      - name: Build (ad-hoc, unsigned)
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project Erosion.xcodeproj \
            -scheme Erosion \
            -configuration Release \
            -derivedDataPath build/DerivedDataApp \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ASSETCATALOG_COMPILER_OPTIMIZATION=space \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_SWIFT_SYMBOLS=YES \
            SEPARATE_STRIP=YES \
            STRIP_STYLE=all 2>&1 | tee build.log
      - name: Package IPA
        script: |
          set -euo pipefail
          APP="build/DerivedDataApp/Build/Products/Release-iphoneos/Erosion.app"
          [ -d "$APP" ] || { echo "app not found, see log"; tail -60 build.log; exit 1; }
          codesign --remove "$APP" 2>/dev/null || true
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          find "$APP" -name '_CodeSignature' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP" -name 'CodeResources' -delete 2>/dev/null || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S"Erosion/Erosion.entitlements" "$APP" || echo "ldid failed, continuing without entitlements"
          elif brew install ldid >/dev/null 2>&1; then
            ldid -S"Erosion/Erosion.entitlements" "$APP" || echo "ldid failed, continuing without entitlements"
          else
            echo "ldid unavailable, packaging without entitlements (SideStore re-signs anyway)"
          fi
          rm -rf Payload Erosion.ipa
          mkdir -p Payload
          cp -R "$APP" "Payload/Erosion.app"
          zip -qry Erosion.ipa Payload
          ls -lh Erosion.ipa
          [ -f "Payload/Erosion.app/Erosion" ] || { echo "missing executable"; exit 1; }
    artifacts:
      - Erosion.ipa
      - build.log
